<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Farm Brain Dump Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .sortable-ghost { opacity: 0.35; transform: scale(0.98); background-color: #334155 !important; border: 2px dashed #38bdf8 !important; }
    .sortable-chosen { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .sortable-drag { opacity: 0.95; transform: rotate(2deg); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .column-scroll { max-height: calc(100vh - 210px); }
    @media (max-width: 768px) { .column-scroll { max-height: calc(100vh - 270px); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none pb-20 md:pb-6">
  <!-- Top Navigation Bar -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-3 py-2.5 sm:px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-600/20 text-emerald-400 p-2 rounded-xl border border-emerald-500/30">
          <i data-lucide="layout-grid" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-1.5">
              <span>Farm Brain Dump</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-emerald-400 border border-emerald-500/30 font-medium">v.0</span>
            </h1>
          </div>
          <div class="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
            <span id="sync-status-indicator" class="flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span id="sync-status-text" class="text-[11px] font-medium text-emerald-400">Offline Caching Active</span>
            </span>
            <span>•</span>
            <span id="storage-count-text" class="text-[11px] text-slate-400">16 tasks</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-sync-now" onclick="syncWithGoogleSheet()" title="Sync with Google Sheet"
          class="p-2 sm:px-3 sm:py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 text-xs font-medium border border-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="refresh-cw" class="w-4 h-4 text-emerald-400" id="sync-icon"></i>
          <span class="hidden sm:inline">Sync Sheet</span>
        </button>
        <button onclick="openSettingsModal()" title="Settings & Connection"
          class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-300 border border-slate-700 transition">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
        <button onclick="openTaskModal()" title="Add New Task"
          class="hidden sm:flex px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-xs font-medium items-center gap-1.5 transition shadow-lg shadow-emerald-950/40">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>New Task</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Metrics Bar -->
  <section class="bg-slate-900/60 border-b border-slate-800/80 px-3 py-2 sm:px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 overflow-x-auto no-scrollbar py-0.5">
      <div class="flex items-center gap-2 sm:gap-4 shrink-0">
        <div onclick="setFilter('all')" class="cursor-pointer flex items-center gap-2 bg-slate-800/70 hover:bg-slate-800 px-2.5 py-1.5 rounded-lg border border-slate-700/60 transition">
          <span class="text-xs text-slate-400">Total:</span>
          <span id="metric-total" class="text-xs font-bold text-white">16</span>
        </div>
        <div onclick="setFilter('urgent')" class="cursor-pointer flex items-center gap-2 bg-rose-950/40 hover:bg-rose-950/60 px-2.5 py-1.5 rounded-lg border border-rose-800/50 transition">
          <i data-lucide="alert-circle" class="w-3.5 h-3.5 text-rose-400"></i>
          <span class="text-xs text-rose-200">Urgent:</span>
          <span id="metric-urgent" class="text-xs font-bold text-rose-300">4</span>
        </div>
        <div onclick="setFilter('inprogress')" class="cursor-pointer flex items-center gap-2 bg-amber-950/40 hover:bg-amber-950/60 px-2.5 py-1.5 rounded-lg border border-amber-800/50 transition">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-400"></i>
          <span class="text-xs text-amber-200">In Progress:</span>
          <span id="metric-inprogress" class="text-xs font-bold text-amber-300">1</span>
        </div>
        <div onclick="setFilter('need_supplies')" class="cursor-pointer flex items-center gap-2 bg-orange-950/40 hover:bg-orange-950/60 px-2.5 py-1.5 rounded-lg border border-orange-800/50 transition">
          <i data-lucide="package" class="w-3.5 h-3.5 text-orange-400"></i>
          <span class="text-xs text-orange-200">Need Supplies:</span>
          <span id="metric-supplies-needed" class="text-xs font-bold text-orange-300">8</span>
        </div>
        <div onclick="setFilter('done')" class="cursor-pointer flex items-center gap-2 bg-emerald-950/40 hover:bg-emerald-950/60 px-2.5 py-1.5 rounded-lg border border-emerald-800/50 transition">
          <i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span class="text-xs text-emerald-200">Done:</span>
          <span id="metric-done" class="text-xs font-bold text-emerald-300">1</span>
        </div>
      </div>
      <div id="filter-active-indicator" class="hidden shrink-0">
        <button onclick="setFilter('all')" class="text-[11px] text-sky-400 hover:text-sky-300 underline flex items-center gap-1">
          <i data-lucide="x" class="w-3 h-3"></i> Clear Filter
        </button>
      </div>
    </div>
  </section>

  <!-- Filter & Search -->
  <section class="max-w-7xl mx-auto w-full px-3 py-2 sm:px-6">
    <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center justify-between">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="search-input" oninput="renderBoard()" placeholder="Search tasks, notes, or next steps..."
          class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-8 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
        <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
        <select id="filter-subject" onchange="renderBoard()" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none">
          <option value="all">All Subjects</option>
          <option value="Garden">Garden</option>
          <option value="Greenhouse">Greenhouse</option>
          <option value="House Exterior">House Exterior</option>
          <option value="House Interior">House Interior</option>
          <option value="Yard">Yard</option>
          <option value="Off-Property">Off-Property</option>
        </select>
        <select id="filter-priority" onchange="renderBoard()" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none">
          <option value="all">All Priorities</option>
          <option value="High">High Priority</option>
          <option value="Medium">Medium Priority</option>
          <option value="Low">Low Priority</option>
        </select>
        <select id="filter-supplies" onchange="renderBoard()" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none">
          <option value="all">All Supplies</option>
          <option value="Y">Supplies Ready (Y)</option>
          <option value="N">Needs Supplies (N)</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Mobile Column Switcher -->
  <div class="md:hidden max-w-7xl mx-auto w-full px-3 mb-2">
    <div class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-center text-xs">
      <button onclick="setMobileTab('Backlog')" id="tab-Backlog" class="mobile-tab-btn py-1.5 px-1 rounded-lg font-medium transition text-slate-400">Backlog (<span id="tab-count-Backlog">0</span>)</button>
      <button onclick="setMobileTab('Not Started')" id="tab-NotStarted" class="mobile-tab-btn py-1.5 px-1 rounded-lg font-medium transition bg-slate-800 text-white shadow">Queued (<span id="tab-count-NotStarted">0</span>)</button>
      <button onclick="setMobileTab('In progress')" id="tab-Inprogress" class="mobile-tab-btn py-1.5 px-1 rounded-lg font-medium transition text-amber-400">Active (<span id="tab-count-Inprogress">0</span>)</button>
      <button onclick="setMobileTab('Done')" id="tab-Done" class="mobile-tab-btn py-1.5 px-1 rounded-lg font-medium transition text-emerald-400">Done (<span id="tab-count-Done">0</span>)</button>
    </div>
  </div>

  <!-- Board Columns -->
  <main class="max-w-7xl mx-auto w-full px-3 sm:px-6 flex-1">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 sm:gap-4 h-full items-start">
      <!-- Backlog -->
      <div id="col-container-Backlog" class="kanban-column-wrapper bg-slate-900/80 rounded-2xl border border-slate-800/80 p-3 flex flex-col">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Backlog</h2>
          </div>
          <span id="count-Backlog" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">0</span>
        </div>
        <div id="column-Backlog" data-status="Backlog" class="kanban-cards-list space-y-2.5 min-h-[120px] overflow-y-auto no-scrollbar column-scroll"></div>
      </div>
      <!-- Not Started -->
      <div id="col-container-NotStarted" class="kanban-column-wrapper bg-slate-900/80 rounded-2xl border border-slate-800/80 p-3 flex flex-col">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-sky-300">Not Started</h2>
          </div>
          <span id="count-NotStarted" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-sky-400">0</span>
        </div>
        <div id="column-NotStarted" data-status="Not Started" class="kanban-cards-list space-y-2.5 min-h-[120px] overflow-y-auto no-scrollbar column-scroll"></div>
      </div>
      <!-- In Progress -->
      <div id="col-container-Inprogress" class="kanban-column-wrapper bg-slate-900/80 rounded-2xl border border-amber-500/20 p-3 flex flex-col shadow-lg shadow-amber-950/10">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-amber-300">In Progress</h2>
          </div>
          <span id="count-Inprogress" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-950/40 text-amber-400">0</span>
        </div>
        <div id="column-Inprogress" data-status="In progress" class="kanban-cards-list space-y-2.5 min-h-[120px] overflow-y-auto no-scrollbar column-scroll"></div>
      </div>
      <!-- Done -->
      <div id="col-container-Done" class="kanban-column-wrapper bg-slate-900/80 rounded-2xl border border-emerald-500/20 p-3 flex flex-col">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-300">Done</h2>
          </div>
          <span id="count-Done" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-950/40 text-emerald-400">0</span>
        </div>
        <div id="column-Done" data-status="Done" class="kanban-cards-list space-y-2.5 min-h-[120px] overflow-y-auto no-scrollbar column-scroll"></div>
      </div>
    </div>
  </main>

  <!-- Mobile FAB -->
  <button onclick="openTaskModal()" title="Add Task"
    class="sm:hidden fixed right-4 bottom-5 z-40 w-14 h-14 bg-emerald-600 active:bg-emerald-700 text-white rounded-full shadow-2xl flex items-center justify-center border-2 border-emerald-400/40 transition active:scale-95">
    <i data-lucide="plus" class="w-7 h-7"></i>
  </button>

  <!-- Modal: Task Form -->
  <div id="task-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl p-4 sm:p-6 space-y-4 my-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modal-title" class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-emerald-400"></i>
          <span>Edit Task</span>
        </h3>
        <button onclick="closeTaskModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="task-form" onsubmit="saveTaskForm(event)" class="space-y-3.5">
        <input type="hidden" id="form-task-id">
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Task Summary *</label>
          <input type="text" id="form-summary" required placeholder="e.g., Replace pergola verticals with 4x4s"
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Raw Brain Dump Note</label>
          <textarea id="form-raw-note" rows="2" placeholder="Original unfiltered thought..."
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Actionable Next Step</label>
          <input type="text" id="form-next-step" placeholder="e.g., Purchase 4x4s and anchor mounts"
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-amber-200 focus:outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Status</label>
            <select id="form-status" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
              <option value="Not Started">Not Started</option>
              <option value="In progress">In Progress</option>
              <option value="Backlog">Backlog</option>
              <option value="Done">Done</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Priority</label>
            <select id="form-priority" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
              <option value="High">High (Urgent)</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Subject</label>
            <select id="form-subject" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
              <option value="Garden">Garden</option>
              <option value="Greenhouse">Greenhouse</option>
              <option value="House Exterior">House Exterior</option>
              <option value="House Interior">House Interior</option>
              <option value="Yard">Yard</option>
              <option value="Off-Property">Off-Property</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Category</label>
            <select id="form-category" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
              <option value="Improvement">Improvement</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Repair">Repair</option>
              <option value="Errand">Errand</option>
              <option value="Chore">Chore</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Estimated Effort</label>
            <select id="form-effort" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
              <option value="<30 mins">&lt;30 mins</option>
              <option value="1-2 hours">1-2 hours</option>
              <option value="Half day">Half day</option>
              <option value="Multi-day">Multi-day</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">Supplies on Hand?</label>
            <select id="form-supplies" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
              <option value="Y">Yes (Ready)</option>
              <option value="N">No (Needed)</option>
            </select>
          </div>
        </div>
        <div class="flex items-center justify-between pt-3 border-t border-slate-800">
          <button type="button" id="btn-delete-task" onclick="deleteCurrentTask()" class="hidden text-xs text-rose-400 hover:text-rose-300 px-3 py-2 rounded-lg transition flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>Delete</span>
          </button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" onclick="closeTaskModal()" class="px-3.5 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Cancel</button>
            <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 text-xs font-medium text-white shadow-lg shadow-emerald-950">Save Task</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Settings & Sync -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl p-4 sm:p-6 space-y-4 my-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="cloud" class="w-4 h-4 text-emerald-400"></i>
          <span>Google Sheet Two-Way Sync</span>
        </h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="space-y-4 text-xs text-slate-300">
        <div>
          <label class="block text-[11px] font-semibold text-slate-200 uppercase tracking-wider mb-1">Google Apps Script Web App URL</label>
          <input type="url" id="settings-script-url" placeholder="https://script.google.com/macros/s/.../exec"
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
          <p class="text-[11px] text-slate-500 mt-1">Paste your deployed Web App URL here to enable automatic 2-way cloud syncing.</p>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="pullFromGoogleSheet()" class="px-3 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-medium border border-slate-700 flex items-center justify-center gap-1.5">
            <i data-lucide="arrow-down-circle" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>Pull From Sheet</span>
          </button>
          <button onclick="pushToGoogleSheet()" class="px-3 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-medium border border-slate-700 flex items-center justify-center gap-1.5">
            <i data-lucide="arrow-up-circle" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span>Push All to Sheet</span>
          </button>
        </div>
        <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
          <button onclick="exportDataJson()" class="text-xs text-sky-400 hover:underline flex items-center gap-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Export JSON
          </button>
          <button onclick="resetToDefaultTasks()" class="text-xs text-rose-400 hover:underline flex items-center gap-1">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset to Default
          </button>
        </div>
      </div>
      <div class="pt-2">
        <button onclick="saveSettings()" class="w-full py-2.5 rounded-lg bg-emerald-600 text-xs font-semibold text-white shadow-lg shadow-emerald-950">
          Save Settings
        </button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_TASKS = [
      {"id": "task_1", "timestamp": "2026-08-02", "raw_note": "Drive t-posts into ground for garden gate posts", "summary": "Drive garden gate t-posts", "scope": "Small Task", "category": "Improvement", "subject": "Garden", "complexity": "Medium", "effort": "1-2 hours", "priority": "Medium", "status": "Done", "next_step": "Gather tools and materials", "supplies_on_hand": "Y"},
      {"id": "task_2", "timestamp": "2026-08-02", "raw_note": "Trench and bury PVC for greenhouse", "summary": "Trench and bury greenhouse PVC", "scope": "Large Project", "category": "Improvement", "subject": "Greenhouse", "complexity": "High", "effort": "Half day", "priority": "Medium", "status": "In progress", "next_step": "repair irrigation to continue", "supplies_on_hand": "Y"},
      {"id": "task_3", "timestamp": "2026-08-02", "raw_note": "Pergola replace verticals with 4x4s, get anchor mounts", "summary": "Replace pergola verticals with 4x4s", "scope": "Large Project", "category": "Improvement", "subject": "House Exterior", "complexity": "High", "effort": "Multi-day", "priority": "High", "status": "Not Started", "next_step": "Purchase 4x4s and anchor mounts", "supplies_on_hand": "N"},
      {"id": "task_4", "timestamp": "2026-08-02", "raw_note": "Need to refill gas cans", "summary": "Refill gas cans", "scope": "Small Task", "category": "Errand", "subject": "Off-Property", "complexity": "Low", "effort": "<30 mins", "priority": "High", "status": "Not Started", "next_step": "Take gas cans to station", "supplies_on_hand": "N"},
      {"id": "task_5", "timestamp": "2026-08-02", "raw_note": "Figure out how to mount the big solar light and do it", "summary": "Mount solar light", "scope": "Small Task", "category": "Improvement", "subject": "Yard", "complexity": "Medium", "effort": "1-2 hours", "priority": "Medium", "status": "Not Started", "next_step": "Assess mounting location and hardware needed", "supplies_on_hand": "N"},
      {"id": "task_6", "timestamp": "2026-08-02", "raw_note": "Clean the algae off the north side of house", "summary": "Clean algae from house exterior", "scope": "Small Task", "category": "Maintenance", "subject": "House Exterior", "complexity": "Medium", "effort": "Half day", "priority": "Medium", "status": "Not Started", "next_step": "Purchase or prepare cleaning solution", "supplies_on_hand": "N"},
      {"id": "task_7", "timestamp": "2026-08-09", "raw_note": "Order mulch delivery", "summary": "Order mulch delivery", "scope": "Small Task", "category": "Maintenance", "subject": "Garden", "complexity": "Low", "effort": "<30 mins", "priority": "Medium", "status": "Not Started", "next_step": "Calculate mulch volume needed", "supplies_on_hand": "N"},
      {"id": "task_8", "timestamp": "2026-08-09", "raw_note": "Trim the projector mount boom", "summary": "Trim projector mount boom", "scope": "Small Task", "category": "Repair", "subject": "House Interior", "complexity": "Low", "effort": "<30 mins", "priority": "Low", "status": "Backlog", "next_step": "Measure and mark cut line", "supplies_on_hand": "Y"},
      {"id": "task_9", "timestamp": "2026-08-16", "raw_note": "Setup a composting system (winter 2026)", "summary": "Setup a composting system for winter 2026", "scope": "Large Project", "category": "Improvement", "subject": "Garden", "complexity": "Medium", "effort": "Half day", "priority": "Medium", "status": "Backlog", "next_step": "Research bin/bay layout, choose location near garden, and gather pallets or fencing materials.", "supplies_on_hand": "N"},
      {"id": "task_10", "timestamp": "2026-08-26", "raw_note": "Fix the God damn irrigation", "summary": "Troubleshoot and repair irrigation / well pump control system", "scope": "Small Task", "category": "Repair", "subject": "Garden", "complexity": "Medium", "effort": "1-2 hours", "priority": "High", "status": "Not Started", "next_step": "Test well pump contactor/relay and inspect lines for pressure leaks or electrical faults.", "supplies_on_hand": "Y"},
      {"id": "task_11", "timestamp": "2026-08-26", "raw_note": "Clean out gutters ", "summary": "Clear leaves and debris from building gutters", "scope": "Small Task", "category": "Maintenance", "subject": "House Exterior", "complexity": "Low", "effort": "1-2 hours", "priority": "Medium", "status": "Not Started", "next_step": "Position ladder, inspect gutter runs, and clear accumulated debris.", "supplies_on_hand": "Y"},
      {"id": "task_12", "timestamp": "2026-08-26", "raw_note": "Harvest a deer for during deer", "summary": "Hunt and harvest a deer during Missouri deer season for meat", "scope": "Large Project", "category": "Errand", "subject": "Off-Property", "complexity": "High", "effort": "Multi-day", "priority": "Medium", "status": "Backlog", "next_step": "Verify season dates, inspect tags and hunting gear, and prepare butchering/freezer storage.", "supplies_on_hand": "Y"},
      {"id": "task_13", "timestamp": "2026-08-26", "raw_note": "diesel containers for", "summary": "Procure and fill dedicated diesel fuel containers for tractor/farm equipment", "scope": "Small Task", "category": "Errand", "subject": "Off-Property", "complexity": "Low", "effort": "<30 mins", "priority": "Medium", "status": "Not Started", "next_step": "Purchase 5-gallon yellow diesel containers and fill with fuel in town.", "supplies_on_hand": "N"},
      {"id": "task_14", "timestamp": "2026-08-26", "raw_note": "sod greenhouse foundation", "summary": "Install sod / ground cover around 10x18 greenhouse foundation perimeter", "scope": "Small Task", "category": "Improvement", "subject": "Greenhouse", "complexity": "Medium", "effort": "Half day", "priority": "Medium", "status": "Not Started", "next_step": "Measure perimeter around greenhouse foundation, calculate sod needed, and prep edge soil.", "supplies_on_hand": "N"},
      {"id": "task_15", "timestamp": "2026-08-26", "raw_note": "Slaughter green geese", "summary": "Process/harvest young farm geese for meat", "scope": "Large Project", "category": "Chore", "subject": "Yard", "complexity": "High", "effort": "Half day", "priority": "High", "status": "Not Started", "next_step": "Prep scalder, plucker, and processing station; sanitize coolers and ice.", "supplies_on_hand": "Y"},
      {"id": "task_16", "timestamp": "2026-08-26", "raw_note": "replacing interior door", "summary": "Procure, hang, and trim a replacement interior door", "scope": "Small Task", "category": "Improvement", "subject": "House Interior", "complexity": "Medium", "effort": "1-2 hours", "priority": "Low", "status": "Backlog", "next_step": "Measure existing door slab and frame dimensions; procure replacement slab and hardware.", "supplies_on_hand": "N"}
    ];

    let tasks = [];
    let activeMobileTab = 'Not Started';
    let currentFilter = 'all';
    let scriptUrl = localStorage.getItem('farm_braindump_script_url') || '';

    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      initSortable();
      renderBoard();
      updateMetrics();
      lucide.createIcons();
      window.addEventListener('online', updateNetworkStatus);
      window.addEventListener('offline', updateNetworkStatus);
      updateNetworkStatus();
    });

    function updateNetworkStatus() {
      const statusText = document.getElementById('sync-status-text');
      if (navigator.onLine) {
        statusText.textContent = scriptUrl ? 'Cloud Sync Ready' : 'Offline Caching Active';
        statusText.className = scriptUrl ? 'text-[11px] font-medium text-emerald-400' : 'text-[11px] font-medium text-sky-400';
      } else {
        statusText.textContent = 'Offline (Working locally)';
        statusText.className = 'text-[11px] font-medium text-amber-400';
      }
    }

    function loadTasks() {
      const saved = localStorage.getItem('farm_braindump_tasks_v1');
      if (saved) {
        try { tasks = JSON.parse(saved); } catch (e) { tasks = [...DEFAULT_TASKS]; }
      } else {
        tasks = [...DEFAULT_TASKS];
        saveTasksLocally();
      }
    }

    function saveTasksLocally() {
      localStorage.setItem('farm_braindump_tasks_v1', JSON.stringify(tasks));
      document.getElementById('storage-count-text').textContent = tasks.length + ' tasks';
    }

    function getSubjectBadge(subject) {
      const map = {
        'Garden': { bg: 'bg-emerald-950/60 text-emerald-300 border-emerald-800/60', icon: '🌿' },
        'Greenhouse': { bg: 'bg-teal-950/60 text-teal-300 border-teal-800/60', icon: '🪴' },
        'House Exterior': { bg: 'bg-indigo-950/60 text-indigo-300 border-indigo-800/60', icon: '🏡' },
        'House Interior': { bg: 'bg-purple-950/60 text-purple-300 border-purple-800/60', icon: '🛋️' },
        'Yard': { bg: 'bg-lime-950/60 text-lime-300 border-lime-800/60', icon: '🌲' },
        'Off-Property': { bg: 'bg-blue-950/60 text-blue-300 border-blue-800/60', icon: '🚙' }
      };
      const item = map[subject] || { bg: 'bg-slate-800 text-slate-300 border-slate-700', icon: '📌' };
      return `<span class="inline-flex items-center gap-1 text-[10px] font-medium px-2 py-0.5 rounded-full border ${item.bg}"><span>${item.icon}</span> <span>${subject}</span></span>`;
    }

    function getPriorityBadge(priority) {
      if (priority === 'High') return `<span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-950/80 text-rose-300 border border-rose-700/60">⚡ Urgent</span>`;
      if (priority === 'Medium') return `<span class="inline-flex items-center text-[10px] font-medium px-2 py-0.5 rounded-full bg-amber-950/60 text-amber-300 border border-amber-800/50">Medium</span>`;
      return `<span class="inline-flex items-center text-[10px] font-medium px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Low</span>`;
    }

    function getEffortBadge(effort) {
      return `<span class="text-[10px] text-slate-400 bg-slate-800/80 px-1.5 py-0.5 rounded border border-slate-700/60 font-mono">⏱ ${effort}</span>`;
    }

    function getSuppliesPill(taskId, supplies) {
      const isYes = (supplies === 'Y');
      const bg = isYes ? 'bg-emerald-950/70 text-emerald-300 border-emerald-700/60' : 'bg-orange-950/70 text-orange-300 border-orange-700/60';
      const label = isYes ? '✓ Supplies: Ready' : '⚠️ Supplies: Needed';
      return `<button onclick="toggleSupplies('${taskId}', event)" title="Tap to toggle supplies" class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full border transition active:scale-95 ${bg}"><span>${label}</span></button>`;
    }

    function normalizeStatus(status) {
      if (!status) return 'Not Started';
      const s = status.trim().toLowerCase();
      if (s === 'in progress' || s === 'inprogress') return 'In progress';
      if (s === 'done' || s === 'completed') return 'Done';
      if (s === 'backlog') return 'Backlog';
      return 'Not Started';
    }

    function renderBoard() {
      const cols = {
        'Backlog': document.getElementById('column-Backlog'),
        'Not Started': document.getElementById('column-NotStarted'),
        'In progress': document.getElementById('column-Inprogress'),
        'Done': document.getElementById('column-Done')
      };
      Object.values(cols).forEach(c => c.innerHTML = '');

      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
      const subjectVal = document.getElementById('filter-subject').value;
      const priorityVal = document.getElementById('filter-priority').value;
      const suppliesVal = document.getElementById('filter-supplies').value;
      document.getElementById('clear-search-btn').classList.toggle('hidden', !searchVal);

      const counts = { 'Backlog': 0, 'Not Started': 0, 'In progress': 0, 'Done': 0 };

      tasks.forEach(task => {
        const normStatus = normalizeStatus(task.status);
        let matches = true;

        if (searchVal) {
          const text = `${task.summary || ''} ${task.raw_note || ''} ${task.next_step || ''} ${task.subject || ''}`.toLowerCase();
          if (!text.includes(searchVal)) matches = false;
        }
        if (subjectVal !== 'all' && task.subject !== subjectVal) matches = false;
        if (priorityVal !== 'all' && task.priority !== priorityVal) matches = false;
        if (suppliesVal !== 'all' && task.supplies_on_hand !== suppliesVal) matches = false;

        if (currentFilter === 'urgent' && task.priority !== 'High') matches = false;
        if (currentFilter === 'inprogress' && normStatus !== 'In progress') matches = false;
        if (currentFilter === 'need_supplies' && task.supplies_on_hand !== 'N') matches = false;
        if (currentFilter === 'done' && normStatus !== 'Done') matches = false;

        counts[normStatus] = (counts[normStatus] || 0) + 1;
        if (!matches) return;

        const card = createCardElement(task);
        if (cols[normStatus]) cols[normStatus].appendChild(card);
      });

      document.getElementById('count-Backlog').textContent = counts['Backlog'] || 0;
      document.getElementById('count-NotStarted').textContent = counts['Not Started'] || 0;
      document.getElementById('count-Inprogress').textContent = counts['In progress'] || 0;
      document.getElementById('count-Done').textContent = counts['Done'] || 0;

      document.getElementById('tab-count-Backlog').textContent = counts['Backlog'] || 0;
      document.getElementById('tab-count-NotStarted').textContent = counts['Not Started'] || 0;
      document.getElementById('tab-count-Inprogress').textContent = counts['In progress'] || 0;
      document.getElementById('tab-count-Done').textContent = counts['Done'] || 0;

      Object.entries(cols).forEach(([st, container]) => {
        if (container.children.length === 0) {
          container.innerHTML = `<div class="flex flex-col items-center justify-center p-6 text-center text-slate-500 border border-dashed border-slate-800/80 rounded-xl bg-slate-950/30"><span class="text-xs">No tasks</span></div>`;
        }
      });

      updateMobileVisibility();
      updateMetrics();
      lucide.createIcons();
    }

    function createCardElement(task) {
      const card = document.createElement('div');
      const isUrgent = task.priority === 'High';
      const borderUrgentClass = isUrgent ? 'border-l-4 border-l-rose-500' : 'border-l-2 border-l-slate-700';

      card.className = `task-card bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-3 shadow-sm transition cursor-grab active:cursor-grabbing group relative ${borderUrgentClass}`;
      card.setAttribute('data-id', task.id);

      card.innerHTML = `
        <div class="flex items-center justify-between gap-1 mb-2">
          <div class="flex items-center gap-1.5 flex-wrap">
            ${getSubjectBadge(task.subject || 'Farm')}
            ${getPriorityBadge(task.priority || 'Medium')}
          </div>
          ${getEffortBadge(task.effort || '1-2 hrs')}
        </div>
        <div class="mb-1.5">
          <h4 class="text-xs sm:text-sm font-semibold text-slate-100 leading-snug group-hover:text-emerald-300 transition" onclick="openTaskModal('${task.id}')">
            ${task.summary || task.raw_note}
          </h4>
          ${task.raw_note && task.raw_note !== task.summary ? `<p class="text-[11px] text-slate-400 line-clamp-1 mt-0.5">${task.raw_note}</p>` : ''}
        </div>
        ${task.next_step ? `
          <div class="bg-slate-900/90 border border-slate-800 rounded-lg p-2 my-2 text-[11px] text-amber-200 flex items-start gap-1.5">
            <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-amber-400 shrink-0 mt-0.5"></i>
            <span class="leading-tight">${task.next_step}</span>
          </div>
        ` : ''}
        <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-800 mt-2">
          <div>${getSuppliesPill(task.id, task.supplies_on_hand || 'N')}</div>
          <div class="flex items-center gap-1 text-slate-400">
            <select onchange="quickMoveTask('${task.id}', this.value)" title="Move Status" class="bg-slate-900 border border-slate-700/60 rounded px-1.5 py-0.5 text-[10px] text-slate-300">
              <option value="" disabled selected>Move ▾</option>
              <option value="Backlog">Backlog</option>
              <option value="Not Started">Not Started</option>
              <option value="In progress">In Progress</option>
              <option value="Done">Done</option>
            </select>
            <button onclick="openTaskModal('${task.id}')" title="Edit" class="p-1 hover:text-white rounded"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
          </div>
        </div>
      `;
      return card;
    }

    function initSortable() {
      ['column-Backlog', 'column-NotStarted', 'column-Inprogress', 'column-Done'].forEach(colId => {
        const el = document.getElementById(colId);
        if (!el) return;
        Sortable.create(el, {
          group: 'farm-kanban',
          animation: 200,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          dragClass: 'sortable-drag',
          delay: 50,
          delayOnTouchOnly: true,
          touchStartThreshold: 5,
          onEnd: function(evt) {
            const taskId = evt.item.getAttribute('data-id');
            const targetStatus = evt.to.getAttribute('data-status');
            if (taskId && targetStatus) updateTaskStatus(taskId, targetStatus);
          }
        });
      });
    }

    function updateTaskStatus(taskId, newStatus) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      task.status = newStatus;
      saveTasksLocally();
      renderBoard();
      if (scriptUrl) triggerSingleTaskSync(task, 'update_status');
    }

    function quickMoveTask(taskId, newStatus) {
      if (newStatus) updateTaskStatus(taskId, newStatus);
    }

    function toggleSupplies(taskId, event) {
      if (event) event.stopPropagation();
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      task.supplies_on_hand = (task.supplies_on_hand === 'Y') ? 'N' : 'Y';
      saveTasksLocally();
      renderBoard();
      if (scriptUrl) triggerSingleTaskSync(task, 'update_supplies');
    }

    function updateMetrics() {
      document.getElementById('metric-total').textContent = tasks.length;
      document.getElementById('metric-urgent').textContent = tasks.filter(t => t.priority === 'High').length;
      document.getElementById('metric-inprogress').textContent = tasks.filter(t => normalizeStatus(t.status) === 'In progress').length;
      document.getElementById('metric-supplies-needed').textContent = tasks.filter(t => t.supplies_on_hand === 'N').length;
      document.getElementById('metric-done').textContent = tasks.filter(t => normalizeStatus(t.status) === 'Done').length;
      document.getElementById('filter-active-indicator').classList.toggle('hidden', currentFilter === 'all');
    }

    function setFilter(filterType) { currentFilter = filterType; renderBoard(); }
    function clearSearch() { document.getElementById('search-input').value = ''; renderBoard(); }

    function setMobileTab(tab) {
      activeMobileTab = tab;
      const tabs = { 'Backlog': 'tab-Backlog', 'Not Started': 'tab-NotStarted', 'In progress': 'tab-Inprogress', 'Done': 'tab-Done' };
      Object.entries(tabs).forEach(([k, btnId]) => {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        btn.className = (k === tab) ? 'mobile-tab-btn py-1.5 px-1 rounded-lg font-medium transition bg-slate-800 text-white shadow' : 'mobile-tab-btn py-1.5 px-1 rounded-lg font-medium transition text-slate-400';
      });
      updateMobileVisibility();
    }

    function updateMobileVisibility() {
      if (window.innerWidth >= 768) {
        ['Backlog', 'NotStarted', 'Inprogress', 'Done'].forEach(id => {
          const el = document.getElementById(`col-container-${id}`);
          if (el) el.classList.remove('hidden');
        });
      } else {
        const activeId = activeMobileTab.replace(' ', '');
        ['Backlog', 'NotStarted', 'Inprogress', 'Done'].forEach(id => {
          const el = document.getElementById(`col-container-${id}`);
          if (el) el.classList.toggle('hidden', id !== activeId);
        });
      }
    }
    window.addEventListener('resize', updateMobileVisibility);

    function openTaskModal(taskId = null) {
      const modal = document.getElementById('task-modal');
      const deleteBtn = document.getElementById('btn-delete-task');
      if (taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        document.getElementById('form-task-id').value = task.id;
        document.getElementById('form-summary').value = task.summary || '';
        document.getElementById('form-raw-note').value = task.raw_note || '';
        document.getElementById('form-next-step').value = task.next_step || '';
        document.getElementById('form-status').value = normalizeStatus(task.status);
        document.getElementById('form-priority').value = task.priority || 'Medium';
        document.getElementById('form-subject').value = task.subject || 'Garden';
        document.getElementById('form-category').value = task.category || 'Improvement';
        document.getElementById('form-effort').value = task.effort || '1-2 hours';
        document.getElementById('form-supplies').value = task.supplies_on_hand || 'N';
        deleteBtn.classList.remove('hidden');
      } else {
        document.getElementById('form-task-id').value = '';
        document.getElementById('form-summary').value = '';
        document.getElementById('form-raw-note').value = '';
        document.getElementById('form-next-step').value = '';
        document.getElementById('form-status').value = activeMobileTab || 'Not Started';
        document.getElementById('form-priority').value = 'Medium';
        document.getElementById('form-subject').value = 'Garden';
        document.getElementById('form-category').value = 'Improvement';
        document.getElementById('form-effort').value = '1-2 hours';
        document.getElementById('form-supplies').value = 'N';
        deleteBtn.classList.add('hidden');
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closeTaskModal() {
      const modal = document.getElementById('task-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveTaskForm(e) {
      e.preventDefault();
      const id = document.getElementById('form-task-id').value;
      const summary = document.getElementById('form-summary').value.trim();
      const raw_note = document.getElementById('form-raw-note').value.trim() || summary;
      const next_step = document.getElementById('form-next-step').value.trim();
      const status = document.getElementById('form-status').value;
      const priority = document.getElementById('form-priority').value;
      const subject = document.getElementById('form-subject').value;
      const category = document.getElementById('form-category').value;
      const effort = document.getElementById('form-effort').value;
      const supplies_on_hand = document.getElementById('form-supplies').value;

      if (id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
          Object.assign(task, { summary, raw_note, next_step, status, priority, subject, category, effort, supplies_on_hand });
          if (scriptUrl) triggerSingleTaskSync(task, 'update_task');
        }
      } else {
        const newTask = {
          id: 'task_' + Date.now(),
          timestamp: new Date().toISOString().split('T')[0],
          raw_note, summary,
          scope: effort === 'Multi-day' || effort === 'Half day' ? 'Large Project' : 'Small Task',
          category, subject, complexity: priority === 'High' ? 'High' : 'Medium',
          effort, priority, status, next_step, supplies_on_hand
        };
        tasks.unshift(newTask);
        if (scriptUrl) triggerSingleTaskSync(newTask, 'add_task');
      }
      saveTasksLocally();
      closeTaskModal();
      renderBoard();
    }

    function deleteCurrentTask() {
      const id = document.getElementById('form-task-id').value;
      if (!id) return;
      if (confirm('Delete this task?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasksLocally();
        closeTaskModal();
        renderBoard();
      }
    }

    function openSettingsModal() {
      document.getElementById('settings-script-url').value = scriptUrl;
      const modal = document.getElementById('settings-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closeSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveSettings() {
      scriptUrl = document.getElementById('settings-script-url').value.trim();
      localStorage.setItem('farm_braindump_script_url', scriptUrl);
      closeSettingsModal();
      updateNetworkStatus();
      if (scriptUrl) syncWithGoogleSheet();
    }

    function exportDataJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `farm_braindump_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function resetToDefaultTasks() {
      if (confirm('Reset all tasks to default Brain Dump v.0 items?')) {
        tasks = [...DEFAULT_TASKS];
        saveTasksLocally();
        closeSettingsModal();
        renderBoard();
      }
    }

    async function triggerSingleTaskSync(task, action) {
      if (!scriptUrl) return;
      const statusText = document.getElementById('sync-status-text');
      statusText.textContent = 'Syncing...';
      try {
        await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, task })
        });
        statusText.textContent = 'Synced with Sheet';
        statusText.className = 'text-[11px] font-medium text-emerald-400';
      } catch (err) {
        statusText.textContent = 'Cached Locally (Offline)';
        statusText.className = 'text-[11px] font-medium text-amber-400';
      }
    }

    async function syncWithGoogleSheet() {
      if (!scriptUrl) { openSettingsModal(); return; }
      const syncIcon = document.getElementById('sync-icon');
      const statusText = document.getElementById('sync-status-text');
      syncIcon.classList.add('animate-spin');
      statusText.textContent = 'Pulling from Sheet...';
      try {
        const response = await fetch(scriptUrl + '?action=get_all');
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          tasks = data;
          saveTasksLocally();
          renderBoard();
          statusText.textContent = 'Synced with Sheet';
          statusText.className = 'text-[11px] font-medium text-emerald-400';
        }
      } catch (e) {
        statusText.textContent = 'Sync Failed (Using Cache)';
        statusText.className = 'text-[11px] font-medium text-rose-400';
      } finally {
        syncIcon.classList.remove('animate-spin');
      }
    }

    async function pullFromGoogleSheet() { await syncWithGoogleSheet(); closeSettingsModal(); }

    async function pushToGoogleSheet() {
      if (!scriptUrl) { alert('Please enter your Google Apps Script URL first.'); return; }
      const statusText = document.getElementById('sync-status-text');
      statusText.textContent = 'Pushing to Sheet...';
      try {
        await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'sync_all', tasks })
        });
        alert('Pushed active board state to Google Sheet successfully!');
        statusText.textContent = 'Synced with Sheet';
        statusText.className = 'text-[11px] font-medium text-emerald-400';
        closeSettingsModal();
      } catch (e) {
        alert('Error pushing to sheet. Ensure your Apps Script URL is deployed with access set to Anyone.');
      }
    }
  </script>
</body>
</html>
